<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Super Jeu de Dames - V8</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        /* Réglages généraux du site */
        * { box-sizing: border-box; }
        body { 
            background-color: #1a1a1a; 
            color: white; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 10px;
            overflow-x: hidden; /* Empêche le défilement horizontal */
        }
        
        h1 { font-family: 'Impact', sans-serif; font-size: clamp(24px, 5vw, 36px); margin: 5px 0; letter-spacing: 2px; }
        
        /* Menu d'accueil adaptatif */
        #menu-principal { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 85vh; 
        }
        .btn-menu { 
            font-size: clamp(16px, 4vw, 18px); 
            font-weight: bold; 
            color: white; 
            border: none; 
            padding: 15px 20px; 
            margin: 8px; 
            width: 90%; 
            max-width: 300px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        #btn-ia { background-color: #8B0000; }
        #btn-local { background-color: #2c3e50; }
        #btn-en-ligne { background-color: #d35400; }
        .btn-menu:hover { opacity: 0.9; transform: scale(1.02); }
        
        /* Zone de jeu principale */
        #zone-jeu { display: none; }
        #info-role { font-size: clamp(12px, 3vw, 15px); color: #a0a0a0; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; }
        #info { font-size: clamp(15px, 4vw, 19px); margin-bottom: 10px; color: #FFD700; font-weight: bold; }
        
        /* LE DAMIER MAGIQUE RESPONSIVE (S'adapte parfaitement à toutes les fenêtres) */
        #damier { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            grid-template-rows: repeat(10, 1fr); 
            width: 82vw; 
            height: 82vw;
            max-width: 440px; 
            max-height: 440px;
            /* Sécurité pour écrans horizontaux : utilise la hauteur si elle est plus petite que la largeur */
            width: 68vmin;
            height: 68vmin;
            margin: 0 auto; 
            border: 4px solid #333; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        .case { display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .beige { background-color: #DDBB99; }
        .noire { background-color: #222222; }
        
        /* Pions proportionnels au damier */
        .pion { width: 78%; height: 78%; border-radius: 50%; border: 2px solid #000; box-shadow: 0 3px 0 #111; position: relative; }
        .blanc { background-color: #F5F5DC; }
        .noir { background-color: #8B0000; }
        .dame::after { content: "♔"; font-size: clamp(14px, 4vmin, 22px); color: black; display: block; text-align: center; line-height: 100%; font-weight: bold; }
        
        .selectionne { border: 3px solid #FFD700 !important; box-sizing: border-box; }
        .coup-possible::before { content: ""; width: 34%; height: 34%; background-color: rgba(46, 204, 113, 0.85); border: 1px solid black; border-radius: 50%; position: absolute; z-index: 10; }
        
        /* Boutons d'action en bas */
        #boutons { margin-top: 12px; }
        .btn-action { background-color: #7f8c8d; color: white; border: none; padding: 10px 18px; font-size: clamp(12px, 3vw, 14px); font-weight: bold; cursor: pointer; border-radius: 5px; margin: 4px; }
        .btn-action:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="menu-principal">
        <h1>JEU DE DAMES</h1>
        <button id="btn-ia" class="btn-menu" onclick="choisirMode('ia')">🤖 CONTRE L'IA</button>
        <button id="btn-local" class="btn-menu" onclick="choisirMode('local')">👥 MULTIJOUEUR LOCAL</button>
        <button id="btn-en-ligne" class="btn-menu" onclick="choisirMode('web')">🌐 JOUER À DISTANCE (WEB)</button>
    </div>

    <div id="zone-jeu">
        <h1 id="titre-mode">PARTIE</h1>
        <div id="info-role">Rôle : Assignation...</div>
        <div id="info">Connexion...</div>
        <div id="damier"></div>
        <div id="boutons">
            <button class="btn-action" style="background-color: #27ae60;" onclick="recommencer()">🔄 Recommencer</button>
            <button class="btn-action" onclick="retourMenu()">🏠 Retour au Menu</button>
        </div>
    </div>

    <script>
        const socket = io();
        let plateauActuel = [];
        let selection = null;
        let coupsPossibles = {};
        let monTour = false;
        let modeActuel = "";
        let maChambre = "default";
        let monRole = ""; 

        function choisirMode(mode) {
            modeActuel = mode;
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('zone-jeu').style.display = 'block';
            
            if (mode === 'ia') document.getElementById('titre-mode').innerText = "🤖 MODE CONTRE L'IA";
            if (mode === 'local') document.getElementById('titre-mode').innerText = "👥 MODE LOCAL (1 ÉCRAN)";
            if (mode === 'web') document.getElementById('titre-mode').innerText = "🌐 MODE À DISTANCE";

            maChambre = mode === 'web' ? 'salon_web_fixe' : 'salon_' + Math.random();
            socket.emit('join', { room: maChambre, mode: mode });
        }

        function retourMenu() {
            document.getElementById('zone-jeu').style.display = 'none';
            document.getElementById('menu-principal').style.display = 'flex';
        }

        socket.on('assigner_couleur', (data) => {
            monRole = data.couleur;
            let texteRole = "";
            if (monRole === "blanc") texteRole = "⚪ JOUEUR BLANC (Tu contrôles les Blancs)";
            if (monRole === "noir") texteRole = "⚫ JOUEUR NOIR (Tu contrôles les Noirs)";
            if (monRole === "spectateur") texteRole = "👁️ SPECTATEUR (Regarde la partie)";
            if (monRole === "tout") texteRole = "🎮 Mode Libre / Local";
            document.getElementById('info-role').innerText = texteRole;
        });

        socket.on('mise_a_jour', (data) => {
            plateauActuel = data.grille;
            
            if (modeActuel === 'web') {
                monTour = (data.tour === monRole);
            } else if (modeActuel === 'local') {
                monTour = true;
            } else if (modeActuel === 'ia') {
                monTour = (data.tour === 'blanc');
            }

            selection = null;
            coupsPossibles = {};
            
            let txtStatus = data.termine ? data.termine : `Tour : ${data.tour.toUpperCase()}`;
            if (!data.termine && modeActuel === 'web') {
                if (monTour) txtStatus += " 🟢 (À TOI DE JOUER !)";
                else txtStatus += " 🔴 (En attente de l'adversaire...)";
            }
            if (!data.termine && modeActuel === 'ia' && data.tour === 'noir') txtStatus = "🤖 L'IA réfléchit...";

            document.getElementById('info').innerText = txtStatus;
            genererDamier();
        });

        socket.on('afficher_coups', (data) => {
            coupsPossibles = data.coups;
            genererDamier();
        });

        function genererDamier() {
            const container = document.getElementById('damier');
            container.innerHTML = "";

            for (let l = 0; l < 10; l++) {
                for (let c = 0; c < 10; c++) {
                    const cell = document.createElement('div');
                    cell.className = `case ${(l + c) % 2 === 0 ? 'beige' : 'noire'}`;
                    
                    const val = plateauActuel[l][c];
                    if (val !== 0) {
                        const pion = document.createElement('div');
                        const couleurPion = (val === 1 || val === 3) ? 'blanc' : 'noir';
                        pion.className = `pion ${couleurPion}`;
                        if (val === 3 || val === 4) pion.classList.add('dame');
                        if (selection && selection.l === l && selection.c === c) cell.classList.add('selectionne');
                        cell.appendChild(pion);
                    }

                    if (coupsPossibles[`${l},${c}`] !== undefined) cell.classList.add('coup-possible');
                    cell.onclick = () => clicCase(l, c);
                    container.appendChild(cell);
                }
            }
        }

        function clicCase(l, c) {
            if (!monTour || monRole === "spectateur") return;
            const val = plateauActuel[l][c];
            let tourActuel = document.getElementById('info').innerText.includes("BLANC") ? "blanc" : "noir";
            if (modeActuel === 'ia') tourActuel = "blanc";

            const equipePion = (val === 1 || val === 3) ? 'blanc' : (val === 2 || val === 4) ? 'noir' : null;

            if (equipePion && (modeActuel === 'web' ? equipePion === monRole : equipePion === tourActuel)) {
                selection = {l, c};
                socket.emit('demande_coups', {room: maChambre, l: l, c: c});
            } else if (selection && coupsPossibles[`${l},${c}`] !== undefined) {
                socket.emit('jouer_coup', {
                    room: maChambre,
                    from_l: selection.l, from_c: selection.c,
                    to_l: l, to_c: c,
                    manges: coupsPossibles[`${l},${c}`]
                });
            }
        }

        function recommencer() { socket.emit('recommencer', { room: maChambre }); }
    </script>
</body>
</html>
