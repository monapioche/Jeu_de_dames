<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu de Dames en Ligne</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; text-align: center; }
        h1 { font-family: 'Impact', sans-serif; font-size: 40px; margin-bottom: 10px; letter-spacing: 2px; }
        #info { font-size: 18px; margin-bottom: 15px; color: #FFD700; font-weight: bold; }
        #damier { display: grid; grid-template-columns: repeat(10, 55px); grid-template-rows: repeat(10, 55px); width: 550px; margin: 0 auto; border: 4px solid #333; }
        .case { width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .beige { background-color: #DDBB99; }
        .noire { background-color: #222222; }
        .pion { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #000; box-shadow: 0 4px 0 #111; position: relative; }
        .blanc { background-color: #F5F5DC; }
        .noir { background-color: #8B0000; }
        .dame::after { content: "♔"; font-size: 24px; color: black; display: block; text-align: center; line-height: 40px; font-weight: bold; }
        .selectionne { border: 3px solid #FFD700 !important; box-sizing: border-box; }
        .coup-possible::before { content: ""; width: 14px; height: 14px; background-color: rgba(255,255,255,0.7); border: 1px solid black; border-radius: 50%; position: absolute; z-index: 10; }
        #boutons { margin-top: 20px; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.2s; }
        button:hover { background-color: #219150; }
    </style>
</head>
<body>

    <h1>JEU DE DAMES EN LIGNE</h1>
    <div id="info">Connexion au serveur...</div>
    
    <div id="damier"></div>

    <div id="boutons">
        <button onclick="recommencer()">🔄 Recommencer la partie</button>
    </div>

    <script>
        const socket = io();
        let maCouleur = "";
        let plateauActuel = [];
        let selection = null;
        let coupsPossibles = {};
        let monTour = false;

        socket.on('assigner_couleur', (data) => {
            maCouleur = data.couleur;
        });

        socket.on('mise_a_jour', (data) => {
            plateauActuel = data.grille;
            monTour = (data.tour === maCouleur);
            selection = null;
            coupsPossibles = {};
            
            let status = data.termine ? data.termine : `Tour : ${data.tour.toUpperCase()}`;
            if (!data.termine && monTour) status += " (C'est votre tour !)";
            
            let roleTxt = maCouleur === "spectateur" ? "Spectateur" : `Joueur ${maCouleur.toUpperCase()}`;
            document.getElementById('info').innerText = `[${roleTxt}] — ${status}`;
            
            genererDamier();
        });

        socket.on('afficher_coups', (data) => {
            coupsPossibles = data.coups;
            genererDamier();
        });

        function genererDamier() {
            const container = document.getElementById('damier');
            container.innerHTML = "";

            for (let l = 0; l < 10; l++) {
                for (let c = 0; c < 10; c++) {
                    const cell = document.createElement('div');
                    cell.className = `case ${(l + c) % 2 === 0 ? 'beige' : 'noire'}`;
                    
                    const val = plateauActuel[l][c];
                    if (val !== 0) {
                        const pion = document.createElement('div');
                        const couleurPion = (val === 1 || val === 3) ? 'blanc' : 'noir';
                        pion.className = `pion ${couleurPion}`;
                        if (val === 3 || val === 4) pion.classList.add('dame');
                        
                        if (selection && selection.l === l && selection.c === c) {
                            cell.classList.add('selectionne');
                        }
                        cell.appendChild(pion);
                    }

                    if (coupsPossibles[`${l},${c}`] !== undefined) {
                        cell.classList.add('coup-possible');
                    }

                    cell.onclick = () => clicCase(l, c);
                    container.appendChild(cell);
                }
            }
        }

        function clicCase(l, c) {
            if (!monTour) return;

            const val = plateauActuel[l][c];
            const equipePion = (val === 1 || val === 3) ? 'blanc' : (val === 2 || val === 4) ? 'noir' : null;

            if (equipePion === maCouleur) {
                selection = {l, c};
                socket.emit('demande_coups', {l, c});
            } else if (selection && coupsPossibles[`${l},${c}`] !== undefined) {
                socket.emit('jouer_coup', {
                    from_l: selection.l, from_c: selection.c,
                    to_l: l, to_c: c,
                    mange: coupsPossibles[`${l},${c}`]
                });
            }
        }

        function recommencer() {
            socket.emit('recommencer');
        }
    </script>
</body>
</html>
