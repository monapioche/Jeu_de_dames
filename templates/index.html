<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Dames - V6</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { font-family: 'Impact', sans-serif; font-size: 36px; margin-bottom: 10px; letter-spacing: 2px; }
        #menu-principal { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; }
        .btn-menu { font-size: 18px; font-weight: bold; color: white; border: none; padding: 15px 30px; margin: 10px; width: 280px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        #btn-ia { background-color: #8B0000; }
        #btn-local { background-color: #2c3e50; }
        #btn-en-ligne { background-color: #d35400; }
        .btn-menu:hover { opacity: 0.9; transform: scale(1.02); }
        #zone-jeu { display: none; }
        #info { font-size: 18px; margin-bottom: 15px; color: #FFD700; font-weight: bold; }
        #damier { display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); width: 90vw; max-width: 450px; aspect-ratio: 1 / 1; margin: 0 auto; border: 4px solid #333; }
        .case { display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .beige { background-color: #DDBB99; }
        .noire { background-color: #222222; }
        .pion { width: 75%; height: 75%; border-radius: 50%; border: 2px solid #000; box-shadow: 0 3px 0 #111; position: relative; }
        .blanc { background-color: #F5F5DC; }
        .noir { background-color: #8B0000; }
        .dame::after { content: "♔"; font-size: 20px; color: black; display: block; text-align: center; line-height: 30px; font-weight: bold; }
        .selectionne { border: 3px solid #FFD700 !important; box-sizing: border-box; }
        .coup-possible::before { content: ""; width: 30%; height: 30%; background-color: rgba(0,255,0,0.6); border: 1px solid black; border-radius: 50%; position: absolute; z-index: 10; }
        #boutons { margin-top: 20px; }
        .btn-action { background-color: #7f8c8d; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 5px; }
        .btn-action:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="menu-principal">
        <h1>JEU DE DAMES</h1>
        <button id="btn-ia" class="btn-menu" onclick="choisirMode('ia')">🤖 CONTRE L'IA</button>
        <button id="btn-local" class="btn-menu" onclick="choisirMode('local')">👥 MULTIJOUEUR LOCAL</button>
        <button id="btn-en-ligne" class="btn-menu" onclick="choisirMode('web')">🌐 JOUER À DISTANCE (WEB)</button>
    </div>

    <div id="zone-jeu">
        <h1 id="titre-mode">PARTIE</h1>
        <div id="info">Connexion...</div>
        <div id="damier"></div>
        <div id="boutons">
            <button class="btn-action" style="background-color: #27ae60;" onclick="recommencer()">🔄 Recommencer</button>
            <button class="btn-action" onclick="retourMenu()">🏠 Retour au Menu</button>
        </div>
    </div>

    <script>
        const socket = io();
        let plateauActuel = [];
        let selection = null;
        let coupsPossibles = {};
        let monTour = false;
        let modeActuel = "";
        let maChambre = "default";

        function choisirMode(mode) {
            modeActuel = mode;
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('zone-jeu').style.display = 'block';
            
            if (mode === 'ia') document.getElementById('titre-mode').innerText = "🤖 MODE CONTRE L'IA";
            if (mode === 'local') document.getElementById('titre-mode').innerText = "👥 MODE LOCAL (1 ÉCRAN)";
            if (mode === 'web') document.getElementById('titre-mode').innerText = "🌐 MODE À DISTANCE";

            maChambre = mode === 'web' ? 'salon_web' : 'salon_' + Math.random();
            socket.emit('join', { room: maChambre, mode: mode });
        }

        function retourMenu() {
            document.getElementById('zone-jeu').style.display = 'none';
            document.getElementById('menu-principal').style.display = 'flex';
        }

        socket.on('mise_a_jour', (data) => {
            plateauActuel = data.grille;
            
            if (modeActuel === 'web') {
                monTour = true; // Géré par le serveur selon l'IP/Session pour simplifier ici
            } else if (modeActuel === 'local') {
                monTour = true;
            } else if (modeActuel === 'ia') {
                monTour = (data.tour === 'blanc');
            }

            selection = null;
            coupsPossibles = {};
            
            let txtStatus = data.termine ? data.termine : `Tour : ${data.tour.toUpperCase()}`;
            if (!data.termine && modeActuel === 'ia' && data.tour === 'noir') txtStatus = "🤖 L'IA réfléchit...";

            document.getElementById('info').innerText = txtStatus;
            genererDamier();
        });

        socket.on('afficher_coups', (data) => {
            coupsPossibles = data.coups;
            genererDamier();
        });

        function genererDamier() {
            const container = document.getElementById('damier');
            container.innerHTML = "";

            for (let l = 0; l < 10; l++) {
                for (let c = 0; c < 10; c++) {
                    const cell = document.createElement('div');
                    cell.className = `case ${(l + c) % 2 === 0 ? 'beige' : 'noire'}`;
                    
                    const val = plateauActuel[l][c];
                    if (val !== 0) {
                        const pion = document.createElement('div');
                        const couleurPion = (val === 1 || val === 3) ? 'blanc' : 'noir';
                        pion.className = `pion ${couleurPion}`;
                        if (val === 3 || val === 4) pion.classList.add('dame');
                        if (selection && selection.l === l && selection.c === c) cell.classList.add('selectionne');
                        cell.appendChild(pion);
                    }

                    if (coupsPossibles[`${l},${c}`] !== undefined) cell.classList.add('coup-possible');
                    cell.onclick = () => clicCase(l, c);
                    container.appendChild(cell);
                }
            }
        }

        function clicCase(l, c) {
            if (!monTour) return;
            const val = plateauActuel[l][c];
            let tourActuel = document.getElementById('info').innerText.includes("BLANC") ? "blanc" : "noir";
            if (modeActuel === 'ia') tourActuel = "blanc";

            const equipePion = (val === 1 || val === 3) ? 'blanc' : (val === 2 || val === 4) ? 'noir' : null;

            if (equipePion && equipePion === tourActuel) {
                selection = {l, c};
                socket.emit('demande_coups', {room: maChambre, l: l, c: c});
            } else if (selection && coupsPossibles[`${l},${c}`] !== undefined) {
                socket.emit('jouer_coup', {
                    room: maChambre,
                    from_l: selection.l, from_c: selection.c,
                    to_l: l, to_c: c,
                    mange: coupsPossibles[`${l},${c}`]
                });
            }
        }

        function recommencer() { socket.emit('recommencer', { room: maChambre }); }
    </script>
</body>
</html>
